name: govern
on:
  pull_request:
  merge_group:
  push:
  workflow_call:
permissions: {}
jobs:
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Identity claims (decoded payload only; the token itself is never printed)
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then echo "S0-CLAIMS: no id-token available"; exit 0; fi
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=s0-spike" | jq -r .value)
          p=$(printf '%s' "$tok" | cut -d. -f2 | tr '_-' '/+'); unset tok
          while [ $(( ${#p} % 4 )) -ne 0 ]; do p="$p="; done
          printf '%s' "$p" | base64 -d | jq -c '{sub, repository, event_name, ref, workflow_ref, workflow_sha, job_workflow_ref, job_workflow_sha}' | sed 's/^/S0-CLAIMS: /'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide
        run: |
          set -euo pipefail
          ev="$GITHUB_EVENT_NAME"
          case "$ev" in
            pull_request) base=$(jq -r .pull_request.base.sha "$GITHUB_EVENT_PATH"); head=$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH");;
            merge_group)  base=$(jq -r .merge_group.base_sha "$GITHUB_EVENT_PATH"); head=$(jq -r .merge_group.head_sha "$GITHUB_EVENT_PATH");;
            push)         base=$(jq -r .before "$GITHUB_EVENT_PATH"); head=$(jq -r .after "$GITHUB_EVENT_PATH");;
            *) echo "S0-DECISION: event $ev — nothing to decide"; exit 0;;
          esac
          echo "S0-CONTEXT: repo=$GITHUB_REPOSITORY event=$ev workflow_ref=$GITHUB_WORKFLOW_REF base=$base head=$head head_tree=$(git rev-parse "$head^{tree}" 2>/dev/null || echo unknown)"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then echo "S0-DECISION: new ref, no base"; exit 0; fi
          if git diff --name-only "$base...$head" | grep -qx forbidden.txt; then echo "S0-DECISION: FAILED (forbidden.txt touched)"; exit 1; fi
          echo "S0-DECISION: CONFORMS"
