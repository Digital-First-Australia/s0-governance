name: s1-sign
# W1-02 spike S1: keyless multi-subject in-toto signing from G's reusable workflow (throwaway).
on:
  workflow_call:
  workflow_dispatch:
permissions: {}
jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      COSIGN_VERSION: v3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
      PREDICATE_TYPE: https://example.invalid/govern/plan-approval/v1
    steps:
      - name: Identity claims (decoded payload only; the token itself is never printed)
        id: claims
        run: |
          set -euo pipefail
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=s1-spike" | jq -r .value)
          p=$(printf '%s' "$tok" | cut -d. -f2 | tr '_-' '/+'); unset tok
          while [ $(( ${#p} % 4 )) -ne 0 ]; do p="$p="; done
          printf '%s' "$p" | base64 -d | jq -S '{sub, repository, repository_id, repository_owner_id, event_name, ref, sha, workflow_ref, workflow_sha, job_workflow_ref, job_workflow_sha, runner_environment, run_id, run_attempt}' > "$RUNNER_TEMP/claims.json"
          sed 's/^/S1-CLAIMS: /' "$RUNNER_TEMP/claims.json"
          echo "jws=$(jq -r .job_workflow_sha "$RUNNER_TEMP/claims.json")" >> "$GITHUB_OUTPUT"
      - name: Check out G at the job workflow's own SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Digital-First-Australia/s0-governance
          ref: ${{ steps.claims.outputs.jws }}
          path: g
          persist-credentials: false
      - name: Download pinned cosign and check sha256
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/cosign" "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod 0555 "$RUNNER_TEMP/bin/cosign"
          "$RUNNER_TEMP/bin/cosign" version 2>&1 | grep GitVersion
      - name: Build 3-subject statement and sign keyless
        run: |
          set -euo pipefail
          mkdir -p out
          python3 -I g/s1/scripts/build_statement.py g/s1/fixtures out/statement.json
          cp "$RUNNER_TEMP/claims.json" out/claims.json
          set -x
          "$RUNNER_TEMP/bin/cosign" attest-blob --statement out/statement.json --bundle out/ci.sigstore.json --yes
          set +x
          sha256sum out/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s1-${{ github.event_name }}-${{ github.run_id }}
          path: out/
